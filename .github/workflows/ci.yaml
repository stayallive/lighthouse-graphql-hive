name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - release/**

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSER_NO_INTERACTION: 1

    strategy:
      fail-fast: false
      matrix:
        php: [ "8.5", "8.4", "8.3", "8.2" ]
        laravel: [ "13", "12" ]
        include:
          - laravel: "13"
            testbench: "11"
          - laravel: "12"
            testbench: "10"
        exclude:
          - laravel: "13"
            php: "8.2"

    name: phpunit (PHP:${{ matrix.php }} Laravel:${{ matrix.laravel }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}" "orchestra/testbench:^${{ matrix.testbench }}" --no-update --no-interaction
          composer update --no-interaction --prefer-dist --no-progress

      - name: Run phpunit
        run: composer test:ci
